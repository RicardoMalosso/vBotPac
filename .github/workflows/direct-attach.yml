name: Direct client attachment
on: [push, pull_request]
jobs:
  rpc:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python -m unittest discover -s tests -v
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -c "import sys;sys.path.insert(0,'external');from native import binaries;print(binaries())"
      - uses: actions/upload-artifact@v4
        with:
          name: vbotpac-native-x64
          path: |
            build-external/pinj.exe
            build-external/pinj_bridge.dll
            build-external/Release/pinj.exe
            build-external/Release/pinj_bridge.dll
