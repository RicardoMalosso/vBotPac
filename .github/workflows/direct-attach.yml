name: Direct client attachment
on: [push, pull_request]
jobs:
  rpc:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.6
      - run: python -m unittest discover -s tests -v
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: native
        run: |
          python -c "import os,sys;sys.path.insert(0,'external');from native import binaries;c,d=binaries();open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8').write('controller='+str(c)+'\ndll='+str(d)+'\n')"
      - name: Rebuild with previous DLL still mapped
        run: python tests/verify_native_build_cache.py
      - uses: actions/upload-artifact@v4
        with:
          name: vbotpac-native-x64
          path: |
            ${{ steps.native.outputs.controller }}
            ${{ steps.native.outputs.dll }}
