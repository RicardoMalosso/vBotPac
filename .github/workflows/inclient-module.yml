name: In-client vBot module
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned standalone LuaJIT for native API tests
        uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT
          ref: b83bcba6ea300d4eb16e8257ddf80bcdef1f938b
          path: build-test-luajit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - name: Install test LuaJIT and pinned project CMake
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then P=.venv/Scripts/python.exe; else P=.venv/bin/python; fi
          "$P" -m pip install lupa==2.6
          "$P" -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-cmake.txt
      - name: Check complete package and lifecycle
        shell: bash
        run: |
          if [ -f .venv/Scripts/python.exe ]; then P=.venv/Scripts/python.exe; else P=.venv/bin/python; fi
          "$P" -m unittest discover -s tests -v
          "$P" tests/build_native_module.py --lua-source build-test-luajit
